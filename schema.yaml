openapi: 3.0.3
info:
  title: Cloudgene API
  version: 1.0.0
paths:
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/logs/:
    get:
      operationId: admin_logs_list
      parameters:
      - in: query
        name: component
        schema:
          type: string
        description: e.g. jobs, auth, admin
      - in: query
        name: level
        schema:
          type: string
        description: Exact level (debug…critical)
      - in: query
        name: min_level
        schema:
          type: string
        description: This level and above
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Substring of the message
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSystemLogList'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
