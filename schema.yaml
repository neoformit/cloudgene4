          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/workflows/:
    get:
      operationId: workflows_list
      description: |-
        ViewSet for browsing workflows.
        Unauthenticated users see only public workflows.
        Authenticated users also see workflows for their groups.
        Admins see all enabled workflows.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - workflows
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowList'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/workflows/{id}/:
    get:
      operationId: workflows_retrieve
