        array).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminGroupRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
