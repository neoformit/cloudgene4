components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    CategoryEnum:
      enum:
      - general
      - nextflow
      - mail
      - security
      - queue
      type: string
      description: |-
        * `general` - General
        * `nextflow` - Nextflow
        * `mail` - Mail
        * `security` - Security
        * `queue` - Queue
    Counter:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        value:
          type: integer
          readOnly: true
        description:
          type: string
        last_updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - last_updated
      - name
      - value
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
      required:
      - id
      - name
    JobDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Optional job name
          maxLength: 255
        workflow_name:
          type: string
          readOnly: true
        user_username:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status298Enum'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: string
          readOnly: true
        parameters:
          description: Input parameters for the job
        results:
          readOnly: true
        logs:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        priority:
          type: integer
          readOnly: true
        queue_position:
          type: integer
          readOnly: true
          nullable: true
        workspace_dir:
          type: string
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JobStep'
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/JobMessage'
          readOnly: true
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/JobDownload'
          readOnly: true
        can_cancel:
          type: string
          readOnly: true
        can_restart:
          type: string
          readOnly: true
      required:
      - can_cancel
      - can_restart
      - completed_at
      - downloads
      - duration
      - error_message
      - id
      - logs
      - messages
      - priority
      - queue_position
      - results
      - started_at
      - status
      - steps
      - submitted_at
      - user_username
      - workflow_name
      - workspace_dir
    JobDownload:
