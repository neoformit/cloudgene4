      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: me_token_destroy
      description: |-
        ``/api/me/token``: POST creates (or regenerates) the API token and returns the key
        once; DELETE revokes it.
      tags:
      - me
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/workflows/:
    get:
      operationId: workflows_list
      description: |-
        ViewSet for browsing workflows.
        Unauthenticated users see only public workflows.
        Authenticated users also see workflows for their groups.
        Admins see all enabled workflows.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - workflows
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowList'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/workflows/{id}/:
    get:
      operationId: workflows_retrieve
      description: |-
        ViewSet for browsing workflows.
        Unauthenticated users see only public workflows.
        Authenticated users also see workflows for their groups.
        Admins see all enabled workflows.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this workflow.
        required: true
      tags:
      - workflows
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
