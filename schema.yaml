components:
  schemas:
    ActivateResponse:
      type: object
      properties:
        message:
          type: string
        status:
          $ref: '#/components/schemas/ActivateResponseStatusEnum'
      required:
      - message
      - status
    ActivateResponseStatusEnum:
      enum:
      - activated
      - already_active
      type: string
      description: |-
        * `activated` - activated
        * `already_active` - already_active
    AdminGroup:
      type: object
      description: '``/api/admin/groups`` — name unique ignoring case; ``member_count``
        read-only.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        member_count:
          type: integer
          readOnly: true
      required:
      - id
      - member_count
      - name
    AdminGroupRequest:
      type: object
      description: '``/api/admin/groups`` — name unique ignoring case; ``member_count``
        read-only.'
      properties:
        name:
