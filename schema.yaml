          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/me/token/:
    post:
      operationId: me_token_create
      description: |-
        ``/api/me/token``: POST creates (or regenerates) the API token and returns the key
        once; DELETE revokes it.
      tags:
      - me
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: me_token_destroy
      description: |-
        ``/api/me/token``: POST creates (or regenerates) the API token and returns the key
        once; DELETE revokes it.
      tags:
      - me
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
