openapi: 3.0.3
info:
  title: Cloudgene API
  version: 1.0.0
paths:
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/groups/:
    get:
      operationId: admin_groups_list
      description: Groups (for workflow access). List is **not paginated** (a plain
        array).
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminGroup'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: admin_groups_create
      description: Groups (for workflow access). List is **not paginated** (a plain
        array).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGroupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminGroupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminGroupRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/groups/{id}/:
    delete:
      operationId: admin_groups_destroy
      description: Groups (for workflow access). List is **not paginated** (a plain
        array).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this group.
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/jobs/:
    get:
      operationId: admin_jobs_list
      description: All users' jobs for admins (deleted jobs excluded).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Job name / username / workflow / id prefix
      - in: query
        name: state
        schema:
          type: string
          enum:
          - cancelled
          - failed
          - running
          - success
          - waiting
        description: Filter by state (comma-separated list allowed)
      - in: query
        name: user
        schema:
          type: string
        description: User id or username
      - in: query
        name: workflow
        schema:
          type: string
        description: Workflow id
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListList'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/jobs/{id}/cancel/:
    post:
      operationId: admin_jobs_cancel_create
      description: All users' jobs for admins (deleted jobs excluded).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{32,36}$
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
