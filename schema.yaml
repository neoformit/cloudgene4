openapi: 3.0.3
info:
  title: Cloudgene API
  version: 1.0.0
paths:
  /api/admin/counters/:
    get:
      operationId: admin_counters_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCounterList'
          description: ''
        default:
          description: Error envelope (SPEC §3.5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
