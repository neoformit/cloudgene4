[pytest]
# Scoped to e2e/: `pytest e2e` (from the repo root) picks this file; `manage.py test` ignores it.
testpaths = tests
addopts = -ra --tracing retain-on-failure --screenshot only-on-failure
markers =
    serial: mutates global server state (settings.yaml, queue, maintenance); run with `-m serial` and without -n
    worker: needs the `run_worker` process (skipped when the command does not exist)
xfail_strict = false
filterwarnings =
    ignore::DeprecationWarning
