id: slow
name: Slow
version: 1.0.0
description: E2E fixture. Sleeps for the given number of seconds.
category: e2e
workflow:
  steps:
    - name: Sleep
      type: nextflow
      script: main.nf
  inputs:
    - id: seconds
      description: Seconds to sleep
      type: number
      value: 60
      min: 1
      max: 3600
      required: true
  outputs:
    - id: outdir
      description: Output folder
      type: folder
      download: true
